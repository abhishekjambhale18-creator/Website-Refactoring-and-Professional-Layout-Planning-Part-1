<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact - BiteBox</title>
    </head>
    <body>
        <!--Contact Us-->
        <h1>Contact Us</h1>
        <p>
            <a href="index.html">Home</a>
            |
            <a href="menu.html">Menu</a>
            |
            <a href="about.html">About</a>
            |
            <a href="contact.html">Contact</a>
        </p>
        <!--Visite Website-->
        <h2>Visit Our Website</h2>
        <p>
            <a href="https://www.google.com">Visit Google</a>
        </p>

        <!--Customer Registration Form-->
        <hr>
        <h2>Customer Registration & Order Form</h2>
        <form>
            <!--Contact Information-->
            <h3>Customer Infromation</h3>
            <label for="fullname">Full Name</label><br>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="email">Email Adress</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password</label><br>
            <input type="password" id="password" name="passwords"><br><br>

            <label for="phone">Phone Number</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <!--Order Info-->
            <h3>Order Information</h3>
            <label for="quantity">Quantity</label><br>
            <input type="number" id="quantity" name="quantity"><br><br>
            
            <label for="deliveryDate">Preffered Delivery Date</label><br>
            <input type="date" id="deliveryDate" name="deliveryDate"><br><br>

            <label for="food">Select Food Item</label><br>
            <select id="food" name="food">
                <option>Veg Pizza</option>
                <option>Cheese Burger</option>
                <option>White Sauce Pasta</option>
                <option>Cheese Grilled Sandwich</option>
                <option>Chocolate Brownie</option>
            </select><br><br>

            <!--Payment Method-->
            <h3>Payment Method</h3>
            <input type="radio" id="cash" name="payment">
            <label for="cash"> Cash </label><br>

            <input type="radio" id="card" name="payment">
            <label for="card"> Card </label><br>

            <input type="radio" id="upi" name="payment">
            <label for="upi"> UPI </label><br><br>

            <!--Extras-->
            <h3>Extras</h3>
            <input type="checkbox" id="cheese" name="extras">
            <label for="cheese"> Extra Cheese </label><br>

            <input type="checkbox" id="drink" name="extras">
            <label for="drink"> Cold Drink </label><br>

            <input type="checkbox" id="dessert" name="extras">
            <label for="dessert"> Dessert </label><br><br>

            <!--Delivery Instruction-->
            <h3>Delivery Instructions</h3>
            <label for="address">Delivery Address</label><br>
            <textarea id="address" name="address" rows="5" cols="40">
            </textarea><br>
            <input type="submit" value="Place Order">
            <input type="reset" value="Clear Form">
            <br><br>
        </form>
    </body>
</html>
